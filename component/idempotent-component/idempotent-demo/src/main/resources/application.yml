spring:
  datasource:
    url: jdbc:h2:mem:idempotency;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379

xjtu:
  iron:
    idempotent:
      enabled: true

      # 请求未指定 policyName / inline policy 时使用。
      default-policy: durable-default

      # Provider 只是默认映射；Core 最终仍通过 Repository capabilities 校验。
      default-windowed-repository: redis
      default-durable-repository: mybatis

      processing-timeout: 30s

      windowed:
        idempotency-window: 10m
        window-policy: FIXED_FROM_FIRST_ACQUIRE
        record-retention-ttl: 1m
        recovery-mode: NONE
        recover-processing-timeout: false
        recover-failed: false

      durable:
        recovery-mode: EXTERNAL_TASK
        recover-processing-timeout: true
        recover-failed: true

      # 业务项目推荐通过命名 Policy 避免每个方法重复 new 一整套 Options。
      policies:
        demo-windowed:
          mode: WINDOWED
          namespace: demo-windowed
          repository-name: redis
          processing-timeout: 10s
          idempotency-window: 5m
          window-policy: FIXED_FROM_FIRST_ACQUIRE
          record-retention-ttl: 1m
          recovery-mode: NONE

        demo-durable:
          mode: DURABLE
          namespace: demo-durable
          repository-name: mybatis
          processing-timeout: 30s
          recovery-mode: EXTERNAL_TASK
          recover-processing-timeout: true
          recover-failed: true

      lock:
        enabled: false
        provider-name: redisson
        wait-time: 0s
        lease-time: 5s
        fallback-to-state-on-failure: true

      redis:
        enabled: true
        key-prefix: iron:idempotency

      transaction:
        enabled: true
        require-template: true

      jdbc:
        enabled: true
        table-name: iron_idempotency_record
