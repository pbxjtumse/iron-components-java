name: MyBatis Persistence Unification

on:
  push:
    branches:
      - feature/mybatis-persistence-unification-v1
  pull_request:
    paths:
      - 'component/reliable-task-component/**'
      - 'component/idempotent-component/**'
      - 'component/distributed-lock-component/**'
      - 'component/relational-access-component/**'
      - 'component/storage-routing-component/**'
      - 'component/pom.xml'
      - 'component/component-bom/pom.xml'
      - 'pom.xml'
      - '.github/workflows/reliable-task-providers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: MyBatis access and technical-table contracts
        run: mvn -B -ntp -pl :relational-mybatis,:relational-starter,:idempotent-provider-mybatis,:idempotent-integration-storage-routing,:idempotent-starter,:idempotent-storage-routing-e2e,:reliable-task-provider-mybatis,:reliable-task-spring-boot-starter,:distributed-lock-fencing-provider-mybatis,:distributed-lock-starter,:storage-routing-starter -am test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mybatis-persistence-test-reports
          path: '**/target/surefire-reports/**'
