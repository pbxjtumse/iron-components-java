name: Storage routing ShardingSphere adapters
on:
  push:
    branches:
      - feature/storage-routing-shardingsphere-jdbc-v1
      - feature/storage-routing-shardingsphere-proxy-v1
  pull_request:
    paths:
      - 'component/storage-routing-component/**'
      - 'component/relational-access-component/**'
      - 'component/pom.xml'
      - 'pom.xml'
      - '.github/workflows/storage-routing-shardingsphere-jdbc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests and ShardingSphere adapter routing E2E
        run: mvn -B -ntp -pl :storage-routing-integration-shardingsphere-jdbc,:storage-routing-integration-shardingsphere-proxy,:storage-routing-starter -am test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shardingsphere-adapter-test-reports
          path: '**/target/surefire-reports/**'
