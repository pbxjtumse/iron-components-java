name: Storage routing Direct E2E
on:
  push:
    branches: [storage-routing-direct-e2e-hardening]
  pull_request:
    paths:
      - 'component/idempotent-component/**'
      - 'component/storage-routing-component/**'
      - 'component/relational-access-component/**'
      - 'component/transaction-component/**'
      - '.github/workflows/storage-routing-direct-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests and real MySQL Direct E2E
        run: mvn -B -ntp -pl :idempotent-storage-routing-e2e -am -Pdirect-e2e verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-e2e-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
